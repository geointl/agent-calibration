# Template for calibrating against measured triaxial data.
# The agent's write_config tool fills in the test conditions, data paths, loss
# keys and log directory. Edit the initial guesses and bounds for your soil.
NorSandConfig:
  simulation:
    # Simulated strain window (fraction). write_config raises it when a measured
    # curve needs a longer window.
    MaxStrainForSim: 0.22
    NumTheoPts: 3700
    drainage: drained  # "drained" or "undrained"; one entry per test when batch_size > 1
    batch_size: 1      # number of tests
    output_keys: [eps1, q, p, epsV, e, ue]
  material_parameters:
    # Initial guesses for optimized parameters; fixed values for the others.
    csl:
      Gamma: 1.0
      lambda: 0.03
    plasticity:
      Mtc: 1.3
      N: 0.3
      chi_tc: 3.5
      H0: 200.0
      Hy: 300.0
    elasticity:
      G_at_p0: 50000.0
      Gexp: 0.0
      nu: 0.2
    soil_state:
      e0: 0.7
      sigM0: 100.0  # kPa
      eta0: 0.0
OptimizationSettings:
  solver: lbfgsb  # "lbfgsb" or "adam"
  learning_rate: 0.01  # adam only
  n_iterations: 100
  loss_function: mse
  loss_keys: [q, epsV]  # undrained tests: [q, ue]
  # Compare model and data on each test's measured axial-strain points, so tests
  # may have any number of points and any strain spacing. Disable only for data
  # generated by the model itself on its own step grid.
  loss_interpolation:
    enabled: true
    x_key: eps1
  identifiability_diagnostics:
    enabled: true
  log_dir: logs/calibration
  save_interval: 10  # progress plots every N loss evaluations
  data_path: path/to/test.tsv  # one file, or a list with one file per test
  lbfgsb_settings:
    maxfun: 200
    ftol: 1.0e-12
    gtol: 1.0e-07
  parameters:
    # bounds: search range. normalization: scaling range of the Fisher analysis.
    csl:
      Gamma: {optimize: true, bounds: [0.7, 1.4], normalization: [0.7, 1.4]}
      lambda: {optimize: true, bounds: [0.005, 0.08], normalization: [0.005, 0.08]}
    plasticity:
      Mtc: {optimize: true, bounds: [0.9, 1.5], normalization: [0.9, 1.5]}
      N: {optimize: true, bounds: [0.15, 0.5], normalization: [0.15, 0.5]}
      chi_tc: {optimize: true, bounds: [1.5, 14.0], normalization: [1.5, 14.0]}
      H0: {optimize: true, bounds: [30.0, 1000.0], normalization: [30.0, 1000.0]}
      Hy: {optimize: true, bounds: [0.0, 1500.0], normalization: [0.0, 1500.0]}
    elasticity:
      G_at_p0: {optimize: true, bounds: [5000.0, 300000.0], normalization: [5000.0, 300000.0]}
      Gexp: {optimize: false}
      nu: {optimize: false}
    soil_state:
      e0: {optimize: false}
      sigM0: {optimize: false}
      eta0: {optimize: false}
